[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
greenledger = "Hd8P3F7NAnFA6KtYnWZzcfF6LSUMAN6khGXP7Z9kELaB"

[programs.devnet]
greenledger = "Hd8P3F7NAnFA6KtYnWZzcfF6LSUMAN6khGXP7Z9kELaB"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899
